[alembic]

# path to migration scripts
script_location = alembic

# database url
sqlalchemy.url = postgresql://admin:adminpassword@localhost:5432/portfolio_db

# version location
version_locations = %(here)s/alembic/versions

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "version" column
# max_version_id_length = 255

# locale used when rendering the date
# within the migration file and filename
# leave blank for default locale
# prepend the release year
# prepend_release_year = true

# template used to generate migration file name
# The default uses one that matches the previous
# alembic versions
# file_template = %%(rev)s_%%(slug)s

# version code template
# version_code_template =

# 'silent' to suppress SQL echo
# sql.echo = false

# output buffer size for logging
# output_buffer_size =

# import hook
# import =

# SQLAlchemy warn 20
# sqlalchemy.warn_20 = true

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
